name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same ref. PR pushes that arrive in
# rapid succession only spend CI on the latest commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Deterministic checks required before merge. Platform performance sampling
  # runs separately in cloudflare-bench.yml for relevant paths.
  lint:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - run: pnpm install --frozen-lockfile

      - name: Build dist
        # Vitest tests for cloudflare import runtime/admin UI via dist/,
        # so build before test.
        run: pnpm build

      - name: Check package boundaries
        run: pnpm run check:boundaries

      - name: Check skill disclosure audit
        run: pnpm run check:skills

      - name: Check generated plugin manifests
        run: pnpm run check:plugin-manifests

      - name: Check release controller
        run: pnpm run check:release

      - name: Check packed Core and optional product consumers
        run: pnpm run check:optional-packages

      - name: Check packed Bun adapter
        run: pnpm run check:bun-package

      - name: Check packed Vercel adapter
        run: pnpm run check:vercel-package

      - name: Typecheck workspace
        # Starter typecheck/validate moved out with PR #108 (blank
        # migrated to aotter/mantle-starters); run there now.
        run: pnpm typecheck

      - run: pnpm test

      - name: Check packed-consumer provenance rejection
        run: node scripts/check-packed-consumer.mjs --self-test

      - name: Check out the exact Starter consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aotter/mantle-starters
          ref: 38864fccec28939f7f3fcbbaec2b33f015b3b58d
          path: .packed-consumer/mantle-starters
          persist-credentials: false

      - name: Test packed Core in the exact Starter consumer
        # Mirror the downstream bump controller: project skills from the new
        # package before rebuilding and checking the immutable Starter source.
        run: >-
          node scripts/check-packed-consumer.mjs
          --project .packed-consumer/mantle-starters --
          sh -euc 'pnpm --dir blank exec mantle skills;
          pnpm --dir blank generate;
          pnpm build:provision-bundle;
          pnpm check:release-worker;
          pnpm --dir blank check;
          pnpm smoke:provision-bundle;
          pnpm check:core-skills;
          pnpm --dir recipes/typed-web typecheck'
